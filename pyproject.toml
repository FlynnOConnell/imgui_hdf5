[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgui_hdf5"
version = "0.1.0"
description = "A standalone HDF5 file viewer on imgui-bundle."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flynn OConnell", email = "flynnoconnell@gmail.com" }]
keywords = ["imgui", "imgui-bundle", "implot", "hdf5", "h5py", "viewer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "imgui-bundle>=1.92,<2",
    "numpy>=1.23",
    "h5py>=3.0",
    "imgui_data_loader>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
debug = ["imgui_debugger @ git+https://github.com/FlynnOConnell/imgui_debugger@ad9986a59b19428c4fa42f0b64891f8e03bac592"]

[project.scripts]
imgui-hdf5 = "imgui_hdf5.app:run"

[project.urls]
Homepage = "https://github.com/FlynnOConnell/imgui_hdf5"
Source = "https://github.com/FlynnOConnell/imgui_hdf5"
Issues = "https://github.com/FlynnOConnell/imgui_hdf5/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
